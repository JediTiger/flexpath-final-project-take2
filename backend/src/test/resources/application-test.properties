# Tell H2 to spin up an in-memory DB and operate in MySQL mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ensures Spring Boot looks for your schema.sql and data.sql files on startup
spring.sql.init.mode=always
